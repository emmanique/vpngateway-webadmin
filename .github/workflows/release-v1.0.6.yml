name: Publish stable v1.0.6

# One-time release automation. Triggered when this workflow is merged to main;
# workflow_dispatch permits a retry when Actions is re-enabled.
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.0.6.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.0.6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact verified release commit
        uses: actions/checkout@v4
        with:
          ref: f483859ad7c2e6d21871e7fd22cc127ffde3e0eb
          persist-credentials: false
      - name: Verify release provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f483859ad7c2e6d21871e7fd22cc127ffde3e0eb"
          test "$(cat VERSION)" = "1.0.6"
      - name: Build deterministic distribution packages
        run: python3 scripts/build-release-packages.py
      - name: Verify each archive and SHA-256 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, tarfile, zipfile
          from pathlib import Path
          d = Path("releases/public-build")
          m = json.loads((d / "manifest.json").read_text())
          assert m["commit"] == "f483859ad7c2e6d21871e7fd22cc127ffde3e0eb"
          assert m["version"] == "1.0.6"
          assert len(m["files"]) == 2
          for filename, digest in m["files"].items():
              p = d / filename
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, filename
              if filename.endswith(".zip"):
                  with zipfile.ZipFile(p) as z: assert z.testzip() is None
              else:
                  with tarfile.open(p, "r:gz") as t: assert t.getmembers()
              print("VERIFIED", filename)
          PY
      - name: Create GitHub stable release and attach packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd releases/public-build
          if gh release view v1.0.6 >/dev/null 2>&1; then
            echo "Release v1.0.6 already exists; uploading verified assets."
            gh release upload v1.0.6 \
              gateway-vpn-multi-1.0.6-deployment.tar.gz \
              gateway-vpn-multi-1.0.6-deployment.zip manifest.json --clobber
          else
            gh release create v1.0.6 \
              gateway-vpn-multi-1.0.6-deployment.tar.gz \
              gateway-vpn-multi-1.0.6-deployment.zip manifest.json \
              --target f483859ad7c2e6d21871e7fd22cc127ffde3e0eb \
              --title "VPN Gateway Multi v1.0.6" \
              --notes-file ../../docs/releases/v1.0.6.md \
              --latest
          fi
          gh release view v1.0.6 --json name,tagName,isPrerelease,assets,url
