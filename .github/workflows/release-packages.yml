name: Publish v1.0.0 packages
on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.0.0/**'
      - '.github/workflows/release-packages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release packages
        shell: bash
        run: |
          set -euo pipefail
          for file in releases/v1.0.0/*.zip; do unzip -t "$file" >/dev/null; done
          for file in releases/v1.0.0/*.tar.gz; do tar -tzf "$file" >/dev/null; done
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Gateway VPN Multi v1.0.0
          generate_release_notes: true
          files: |
            releases/v1.0.0/*.zip
            releases/v1.0.0/*.tar.gz
